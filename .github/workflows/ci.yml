name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Suite is ~40s wall locally (121 tests) — a single tiered gate is enough;
    # no split into fast/slow tiers until the suite crosses ~5 minutes.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[test]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test (coverage gate 90%)
        run: pytest tests/ -q
